<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berire Erva & Seyyit</title>

    <meta property="og:title" content="Berire Erva & Seyyit" />
    <meta property="og:description" content="Konum için tıklayınız..." />
    <meta property="og:image" content="https://dvty.tr/syd/dvty.jpg" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto&display=swap" rel="stylesheet">
    <!-- Font Awesome (ikonlar için) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrQkTy3Xo9L9K4HqDkJhX5PzYV5yp7xZyF4N6EJIsjdZ0+1yXzUbU5J1+YsyHeXxGq1K8EJQZ7Yx+M4KQg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdf6f0;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header img {
            width: 95%; /* Görselin tam görünmesi için %100 genişlik */
            height: auto; /* Orantılı yükseklik */
        }
        header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3em;
            color: #a0522d; /* Başlık rengi */
            margin: 10px 0;
        }
        .divider {
            //border-top: 2px solid #e0a899; /* Ayırıcı rengi */
            margin: 20px 0; /* Üst ve alt boşluk */
			text-align:center;
        }
        .container {
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        .section {
            margin-bottom: 40px;
            text-align: center; /* Başlıkları ortalamak için */
        }
        .section h2 {
            border-bottom: 2px solid #e0a899;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #a0522d;
        }
        .map-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 oranı */
            height: 0;
            overflow: hidden;
            margin-bottom: 10px; /* Harita ile buton arasında boşluk */
        }
        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #a0522d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            text-align: center; /* Butonun ortalanması için */
        }
        .button:hover {
            background-color: #8b4513;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #e0a899;
            color: white;
        }
        @media (max-width: 600px) {
            header h1 {
                font-size: 2em;
                text-align: center;
                padding: 0 10px;
            }
        }
		.container {
			padding: 20px;
			max-width: 400px; /* Maksimum genişliği buradan ayarlayabilirsin */
			margin: auto;
		}
		header {
			padding: 20px 0px 0px 0px ;
			max-width: 500px; /* Maksimum genişliği buradan ayarlayabilirsin */
			margin: auto;
		}
		.venue {
			display: block; /* Mekan ismini alt satıra almak için */
			font-size: 0.8em; /* Font boyutunu ayarlamak için */
			color: #7a5a4c; /* Mekan isminin rengi */
		}
    </style>
</head>
<body>

    <header>
<!--        <h1>Berire Erva & Seyyit</h1>-->
        <img src="dvty.jpg" alt="Düğün Davetiyesi">
    </header>

    <div class="container">
        <!-- Kına -->
        <div class="section" id="kina">
            <h2>Kına</h2>
            <p><strong>Zaman:</strong> 1 Ağustos Cuma 19:00</p>
            <p><strong>Adres:</strong> İlim Yayma D Salonu </br>İlkadım/Samsun</p>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2998.507201276424!2d36.340772799999996!3d41.2760646!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4088762d8bf414b3%3A0xaf630f376f1d4473!2sSamsun%20%C4%B0lim%20Yayma%20Ve%20E%C4%9Fitim%20Vakf%C4%B1!5e0!3m2!1str!2str!4v1751575015047!5m2!1str!2str" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div style="text-align: center;"> <!-- Butonu ortalamak için -->
                <a href="https://maps.app.goo.gl/4vdSq46iea9xQEsg8" class="button" target="_blank">
                    Haritada Göster <i class="fas fa-map-marker-alt"></i>
                </a>
            </div>
        </div>

        <!-- Düğün -->
        <div class="section" id="dugun-salonu">
            <h2>Düğün</h2>
            <p><strong>Zaman:</strong> 3 Ağustos Pazar 17:00</p>
            <p><strong>Adres:</strong> Çilimli yolu üzeri, Yukarı Karaköy Köyü No:60-1 </br>Çilimli/Düzce </p>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3016.564115572484!2d31.004006!3d40.881439!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zNDDCsDUyJzUzLjIiTiAzMcKwMDAnMTQuNCJF!5e0!3m2!1str!2str!4v1751575086382!5m2!1str!2str" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div style="text-align: center;"> <!-- Butonu ortalamak için -->
                <a href="https://maps.app.goo.gl/WCa3DYTrCamdT8C98" class="button" target="_blank">
                    Haritada Göster <i class="fas fa-map-marker-alt"></i>
                </a>
            </div>
        </div>
    </div>

    <footer>
        <p>Bu mutlu günümüzde sizleri de yanımızda görmekten mutluluk duyarız...</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişiye Özel Davetiye</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kurale&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .container {
            position: relative;
            max-width: 100%;
            text-align: center;
        }
        .invitation {
            width: 100%;
            max-width: 600px; /* Görselin genişliği */
            height: auto;
            display: block;
        }
        .name {
            position: absolute;
            left: 30%; /* Görselin solundan %15 boşluk */
            top: 43%; /* Görselin üstünden %10 boşluk */
            width: 55%; /* Kalan %60 genişlik */
            height: 5%; /* Kalan %20 yükseklik */
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Yazıyı sola hizala */
            font-weight: bold;
            color: #041c7a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            visibility: hidden; /* Başlangıçta gizli olacak */
            font-family: 'Kurale', serif;
            padding-left: 5px; /* Sol hizalama için küçük bir boşluk */
        }
        .name span {
            display: block;
            max-width: 100%;
            max-height: 100%;
            text-align: left;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="itu-iftari/itu-iftari-davetiye.png" alt="Davetiye" class="invitation" id="invitation">
        <div class="name" id="nameField"><span></span></div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param)?.trim();
        }

        function adjustFontSize(element, referenceElement) {
            let fontSize = referenceElement.clientWidth * 0.05; // Görselin genişliğinin %5'i kadar
            element.style.fontSize = fontSize + "px";
            while (element.scrollWidth > element.clientWidth || element.scrollHeight > element.clientHeight) {
                fontSize -= 1;
                element.style.fontSize = fontSize + "px";
                if (fontSize < 10) break; /* Çok küçülmesini önlemek için */
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const name = getQueryParam("isim") || "Davetli";
            const nameField = document.getElementById("nameField").querySelector("span");
            const nameContainer = document.getElementById("nameField");
            const invitation = document.getElementById("invitation");

            invitation.onload = function () {
                nameField.textContent = name;
                adjustFontSize(nameField, invitation);
                nameContainer.style.visibility = "visible"; // Görünürlüğü aç
            };
        });
    </script>
</body>
</html>

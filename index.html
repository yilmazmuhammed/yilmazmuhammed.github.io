<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İTÜ İftarı Davetiyesi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kurale&display=swap');

        body {
            display: flex;
            flex-direction: column; /* Elemanları alt alta dizer */
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* height yerine min-height kullandık ki sığmama yapmasın */
            background-color: #f0f0f0;
            margin: 0;
        }

        .container {
            position: relative;
            max-width: 100%;
            text-align: center;
        }

        .invitation {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
        }

        .name {
            position: absolute;
            left: 31%; /* Görselin solundan %31 boşluk */
            top: 46.1%; /* Görselin üstünden %46.1 boşluk */
            width: 55%; /* Kalan %55 genişlik */
            height: 4.5%; /* Kalan %4.5 yükseklik */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-weight: bold;
            font-style: italic;
            color: #030c22; /* Yeni renk */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Kurale', serif;
            padding-left: 5px;
            visibility: hidden;
        }

        .name span {
            display: block;
            max-width: 100%;
            max-height: 100%;
            text-align: left;
            word-break: break-word;
        }

        /* Katılım Alanı Tasarımı */
        .attendance-section {
            margin-top: 30px;
            text-align: center;
            font-family: 'Kurale', serif;
        }
        .attendance-section h3 {
            color: #162B49;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap; /* Mobilde yan yana sığmazsa alt alta geçsin */
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, sans-serif;
            transition: opacity 0.3s, transform 0.1s;
        }
        .btn:hover { opacity: 0.8; }
        .btn:active { transform: scale(0.95); }

        .btn-yes {
            background-color: #162B49; /* Davetiye temasına uygun lacivert */
            color: white;
        }
        .btn-no {
            background-color: #e0e0e0;
            color: #333;
        }
        #feedback-msg {
            margin-top: 15px;
            font-weight: bold;
            color: #162B49;
            display: none;
        }
    </style>
    <script src="itu-iftari/davetli-listesi.js"></script>


    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BJ60F022LH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-BJ60F022LH');
    </script>

</head>
<body>
<div class="container">
    <img src="itu-iftari/itu-iftari-davetiye.png" alt="Davetiye" class="invitation" id="invitation">
    <div class="name" id="nameField"><span></span></div>
</div>

<div class="attendance-section">
    <h1>İTÜ İFTARI</h1>
    <h3>Katılım Durumunuzu Bildirin</h3>
    <div class="btn-group" id="btnGroup">
        <button class="btn btn-yes" id="btnYes">Tabii ki oradayım</button>
        <button class="btn btn-no" id="btnNo">Maalesef katılamayacağım</button>
    </div>
    <div id="feedback-msg"></div>
</div>

<script>

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param)?.trim();
    }

    function adjustFontSize(element, referenceElement) {
        let fontSize = referenceElement.clientWidth * 0.05;
        element.style.fontSize = fontSize + "px";
        while (element.scrollWidth > element.clientWidth || element.scrollHeight > element.clientHeight) {
            fontSize -= 1;
            element.style.fontSize = fontSize + "px";
            if (fontSize < 10) break;
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const token = getQueryParam("t");
        const nameField = document.getElementById("nameField").querySelector("span");
        const nameContainer = document.getElementById("nameField");
        const invitation = document.getElementById("invitation");

        // Davetiyeyi ve ismi tutan ana alanı seçiyoruz
        const davetiyeKutusu = document.querySelector('.container');

        if (!token || !davetliler[token]) {
            console.log("token:", token, "not found");
            window.location.href = "/404-not-found"
            return; // Kodun hata vermemesi için burada durduruyoruz
        } else {
            console.log(davetliler[token]);
            nameField.textContent = davetliler[token];
        }

        // --- YENİ: İSİM YERLEŞTİRME VE BOYUTLANDIRMA FONKSİYONU ---
        function ismiYerlestir() {
            // Sadece davetiye ekranda görünürse ve resim tamamen yüklendiyse hesaplama yap
            if (davetiyeKutusu.style.display !== 'none' && invitation.complete) {
                adjustFontSize(nameField, invitation);
                nameContainer.style.visibility = "visible";
            }
        }

        // Resim yüklendiğinde tetiklenecek (İlk açılış için)
        invitation.onload = function () {
            ismiYerlestir();
        };

        // --- BUTON İŞLEMLERİ VE ANALYTICS TAKİBİ ---
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const btnGroup = document.getElementById('btnGroup');
        const feedbackMsg = document.getElementById('feedback-msg');

        // 1. KURAL: Sayfa ilk açıldığında davetiyeyi gizle
        davetiyeKutusu.style.display = 'none';

        const davetliIsmi = davetliler[token];
        const storageKey = 'iftar_katilim_' + token;

        // 2. KURAL: SAYFA YÜKLENDİĞİNDE DAHA ÖNCEKİ CEVABI KONTROL ET
        const oncekiCevap = localStorage.getItem(storageKey);

        if (oncekiCevap === 'evet') {
            btnGroup.style.display = 'none';
            davetiyeKutusu.style.display = 'block';
            feedbackMsg.innerText = "Katılım durumunuzu 'Evet' olarak bildirdiniz. İftarda görüşmek üzere!";
            feedbackMsg.style.display = 'block';

            setTimeout(ismiYerlestir, 50);
        }
        else if (oncekiCevap === 'hayir') {
            feedbackMsg.innerText = "Katılmayacağınızı belirttiniz ama durumunuzu güncellemek isterseniz tıklayınız:";
            feedbackMsg.style.display = 'block';
        }

        // --- 3. KURAL: BUTONLARA TIKLANDIĞINDA OLACAKLAR ---

        // 'Tabii ki oradayım' Butonu (EVET)
        btnYes.addEventListener('click', function() {
            gtag('event', 'katilim_evet', {
                'event_category': 'Iftar_2026',
                'event_label': token + ": " +davetliIsmi
            });

            localStorage.setItem(storageKey, 'evet');

            btnGroup.style.display = 'none';
            davetiyeKutusu.style.display = 'block'; // Davetiye ekrana geldi!

            feedbackMsg.innerText = "Harika! Katılımınız kaydedildi. İftarda görüşmek üzere.";
            feedbackMsg.style.display = 'block';

            // Davetiye ekrana geldiği an ismi güvenle hesaplayıp yerleştiriyoruz
            setTimeout(ismiYerlestir, 50);
        });

        // 'Maalesef katılamayacağım' Butonu (HAYIR)
        btnNo.addEventListener('click', function() {
            gtag('event', 'katilim_hayir', {
                'event_category': 'Iftar_2026',
                'event_label': token + ": " +davetliIsmi
            });

            localStorage.setItem(storageKey, 'hayir');

            btnGroup.style.display = 'none';
            davetiyeKutusu.style.display = 'none'; // Davetiye kapalı

            feedbackMsg.innerText = "Katılamamanıza üzüldük :( \n Gelecek seneye seni de bekliyoruz.";
            feedbackMsg.style.display = 'block';
        });
    });

</script>
</body>
</html>

            padding-bottom: 56.25%; /* 16:9 oranı */
            height: 0;
            overflow: hidden;
            margin-bottom: 10px; /* Harita ile buton arasında boşluk */
        }
        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #a0522d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            text-align: center; /* Butonun ortalanması için */
        }
        .button:hover {
            background-color: #8b4513;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #e0a899;
            color: white;
        }
        @media (max-width: 600px) {
            header h1 {
                font-size: 2em;
                text-align: center;
                padding: 0 10px;
            }
        }
